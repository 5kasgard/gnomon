name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust tests (core has zero dependencies)
        run: cargo test --release --offline
      - name: Shared vectors are up to date
        shell: bash
        run: |
          python scripts/make_vectors.py > /tmp/vectors.json
          diff -u tests/vectors/canonical.json /tmp/vectors.json
      - name: Build library into the Python package
        shell: bash
        run: bash scripts/build.sh
      - name: Python tests (standard library only)
        run: python -m unittest discover -s python/tests -v

  # The MCP server against the official MCP Python SDK, as a real host uses
  # it. Gnomon has no dependencies; only this job installs the SDK.
  mcp-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build library into the Python package
        run: bash scripts/build.sh
      - name: Install the official MCP SDK (this job only)
        run: python -m pip install mcp
      - name: Official client talks to the Gnomon MCP server
        env:
          GNOMON_REQUIRE_MCP_SDK: "1"
        run: |
          python -c "import importlib.metadata as m; print('mcp SDK', m.version('mcp'))"
          python -m unittest python/tests/test_mcp_sdk.py -v 2>&1 | tee sdk.txt
          grep -q "^OK$" sdk.txt && ! grep -q "skipped" sdk.txt
