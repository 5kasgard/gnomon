name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust tests (core has zero dependencies)
        run: cargo test --release --offline
      - name: Shared vectors are up to date
        shell: bash
        run: |
          python scripts/make_vectors.py > /tmp/vectors.json
          diff -u tests/vectors/canonical.json /tmp/vectors.json
      - name: Build library into the Python package
        shell: bash
        run: bash scripts/build.sh
      - name: Python tests (standard library only)
        run: python -m unittest discover -s python/tests -v
